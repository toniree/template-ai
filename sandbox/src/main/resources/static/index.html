<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Corporate Cards</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <nav class="topnav">
    <span class="brand">Corporate Cards</span>
    <div class="tabs" id="tabs"></div>
    <div class="nav-links">
      <a href="/help">How it works</a>
      <a href="/swagger-ui.html" target="_blank" rel="noopener">API</a>
      <a href="/h2-console" target="_blank" rel="noopener">DB</a>
    </div>
  </nav>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <main>
    <header class="page-header">
      <h1 id="view-title">&nbsp;</h1>
      <p id="view-subtitle" class="subtitle"></p>
    </header>

    <div id="summary" class="summary"></div>

    <section class="panel" id="form-panel" hidden></section>

    <section class="panel">
      <div class="panel-header">
        <h2 id="list-title">Records</h2>
        <div class="panel-actions">
          <div id="filters" class="filters"></div>
          <button id="refresh" type="button" class="btn btn-secondary">Refresh</button>
        </div>
      </div>

      <p id="list-error" class="error" role="alert" hidden></p>

      <div class="table-wrap">
        <table>
          <thead id="table-head"></thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>

      <div class="pagination" id="pagination" hidden>
        <button id="prev-page" type="button" class="btn btn-secondary">‹ Prev</button>
        <span id="page-info" class="page-info"></span>
        <button id="next-page" type="button" class="btn btn-secondary">Next ›</button>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
