<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Board</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <nav class="topnav">
    <span class="brand">Task Board</span>
    <div class="nav-links">
      <a href="/swagger-ui.html" target="_blank" rel="noopener">API</a>
      <a href="/h2-console" target="_blank" rel="noopener">DB</a>
    </div>
  </nav>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <main>
    <header class="page-header">
      <h1>Tasks</h1>
      <p class="subtitle">The sample screen. Replace it with whatever the interview actually asks for.</p>
    </header>

    <section class="panel">
      <h2>New task</h2>
      <form id="create-form" class="form-row">
        <label>Title
          <input type="text" name="title" maxlength="200" placeholder="Ship the first slice" required>
        </label>
        <label class="grow">Description
          <input type="text" name="description" maxlength="2000" placeholder="Optional">
        </label>
        <button type="submit" class="btn btn-primary">Add task</button>
      </form>
      <p id="form-error" class="error" role="alert" hidden></p>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2>All tasks</h2>
        <div class="panel-actions">
          <select id="status-filter" aria-label="Filter by status">
            <option value="">All statuses</option>
          </select>
          <button id="refresh" type="button" class="btn btn-secondary">Refresh</button>
        </div>
      </div>

      <p id="list-error" class="error" role="alert" hidden></p>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Title</th>
              <th>Description</th>
              <th>Status</th>
              <th>Updated</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="task-rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
