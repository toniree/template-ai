spring:
  application:
    name: sandbox
  profiles:
    active: h2          # "postgres" to run against a real instance; "test" is used by the test suite
  jpa:
    # Off deliberately: entities must be mapped to DTOs inside the service transaction. Leaving it
    # on lets lazy loads fire during JSON serialization, which is how N+1 queries sneak in.
    open-in-view: false
  jackson:
    default-property-inclusion: non_null   # nulls (e.g. declineReason on an approval) stay out of the JSON

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.templateai: DEBUG

---
# ---- h2: default. In-memory, zero setup, reseeded on every boot. --------------
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:sandbox;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

---
# ---- test: isolated database, quiet logs, no demo seed. ----------------------
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
logging:
  level:
    com.templateai: INFO
    org.hibernate: WARN

---
# ---- postgres: docker run -p 5432:5432 -e POSTGRES_PASSWORD=postgres \
#                  -e POSTGRES_DB=sandbox postgres:16
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/sandbox
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
