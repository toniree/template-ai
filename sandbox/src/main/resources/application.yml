spring:
  application:
    name: sandbox
  profiles:
    active: h2   # switch to "postgres" to run against a real PostgreSQL instance

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.templateai: DEBUG
---
# ---- H2 profile: in-memory, zero external setup ---------------------------
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:sandbox;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
---
# ---- Postgres profile ------------------------------------------------------
# Point this at a real PostgreSQL instance, e.g. via:
#   docker run -p 5432:5432 -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=sandbox postgres:16
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/sandbox
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
