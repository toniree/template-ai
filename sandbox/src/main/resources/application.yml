spring:
  application:
    name: sandbox
  profiles:
    active: h2          # "test" is used by the test suite; there is no other profile
  jpa:
    # Off deliberately: entities must be mapped to DTOs inside the service transaction. Leaving it
    # on lets lazy loads fire during JSON serialization, which is how N+1 queries sneak in.
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.templateai: DEBUG

---
# ---- h2: the default. In-memory, seeded on boot, rebuilt on every restart. ----
# MODE=PostgreSQL is a syntax compatibility mode: it reduces the common differences (identifier
# quoting, LIMIT/OFFSET, COALESCE, identity columns) so ordinary JPA and JPQL written here won't
# need rewriting later. It is not an emulator — locking, constraint enforcement, isolation
# behaviour, and native SQL still have to be verified against a real PostgreSQL.
#
# show-sql is on: it is the only way to confirm the query you think you wrote is the query that ran.
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:sandbox;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

---
# ---- postgres: optional, and never needed for the default workflow. ----------
# Only reach for this if the problem genuinely depends on real PostgreSQL behaviour rather than
# syntax — row locking under contention, constraint timing, isolation levels, or native SQL. H2's
# MODE=PostgreSQL covers the syntax; it does not reproduce any of those.
#
#   docker run --rm -p 5432:5432 -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=sandbox postgres:16
#   ./mvnw -o spring-boot:run -Dspring-boot.run.profiles=postgres
#
# ddl-auto: update rather than create-drop, so a restart doesn't discard the data you just made.
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/sandbox
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

---
# ---- test: isolated database, quiet logs, no demo seed. ----------------------
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
logging:
  level:
    com.templateai: INFO
    org.hibernate: WARN
